<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CZG 为 LFY 准备的生日惊喜网页">
  <title>祝小颖宝生日快乐！</title>
  <link rel="preload" href="assets/images/birthday-night.png" as="image">
  <link rel="preload" href="assets/images/birthday-night-mobile.png" as="image" media="(max-width: 820px)">
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/SXS14656/love-web@main/assets/music/happy-birthday.mp3" as="audio" type="audio/mpeg" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas class="sky-canvas" id="skyCanvas" aria-hidden="true"></canvas>
  <canvas class="burst-canvas" id="burstCanvas" aria-hidden="true"></canvas>
  <audio id="audio" preload="auto" loop crossorigin="anonymous" hidden></audio>

  <main class="page-shell">
    <section class="hero">
      <div class="hero__media" aria-hidden="true"></div>
      <div class="hero__overlay"></div>
      <div class="hero__content">
        <h1 class="hero__title">小颖宝宝<br>生日快乐</h1>
        <p class="hero__copy" id="birthdayRevealMessage" hidden>
          今天是你的生日，所有等待都在这一刻变成惊喜。<br>小颖宝宝，生日快乐！
        </p>

        <p class="countdown__note" id="countdownNote">距离 2026-07-28 还有</p>
        <div class="countdown" id="countdown" aria-live="polite">
          <div class="countdown__item">
            <strong id="days">00</strong>
            <span>天</span>
          </div>
          <div class="countdown__item">
            <strong id="hours">00</strong>
            <span>时</span>
          </div>
          <div class="countdown__item">
            <strong id="minutes">00</strong>
            <span>分</span>
          </div>
          <div class="countdown__item">
            <strong id="seconds">00</strong>
            <span>秒</span>
          </div>
        </div>
        <button class="primary-action" id="openSurprise" type="button">
          <span>打开惊喜</span>
        </button>
      </div>
    </section>

    <section class="section" id="letterSection" data-birthday-gated hidden>
      <div class="section__inner letter">
        <h2>给小颖宝宝</h2>
        <div class="letter__paper">
          <p class="letter__greeting">亲爱的小颖宝宝：</p>
          <p>
            小颖二十一岁生日快乐！
          </p>
          <p>
            希望你每天都开心，希望好运总是偏向你，希望你喜欢的事情都有回应，
            也希望以后的普通日子里，我都能陪在你身边。
          </p>
          <p class="signature">曹志国</p>
        </div>
      </div>
    </section>

    <section class="section gift-section" data-birthday-gated hidden>
      <div class="section__inner gift-panel">
        <div>
          <h2>给你准备的小礼物</h2>
          <p class="lead">
            这里藏着一张天猫超市卡。输入百日纪念卡上的4位月日数字，就能打开我给你准备的小惊喜。
          </p>
        </div>
        <div class="gift-box">
          <button class="secondary-action" id="revealGiftCard" type="button">查看天猫超市卡</button>

          <form class="gift-code-form" id="giftCodeForm" hidden>
            <label for="giftCodeInput">输入解锁数字</label>
            <div class="gift-code-row">
              <input id="giftCodeInput" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="只输入数字">
              <button class="secondary-action" type="submit">打开</button>
            </div>
          </form>

          <div class="gift-card-secret" id="giftCardSecret" hidden>
            <p class="gift-card-secret__title">天猫超市卡</p>
            <dl>
              <div>
                <dt>卡号</dt>
                <dd id="giftCardNumber" class="copy-allowed"></dd>
              </div>
              <div>
                <dt>卡密</dt>
                <dd id="giftCardPassword"></dd>
              </div>
            </dl>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
